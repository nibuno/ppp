[package]
name = "pdf-presenter-pacemaker"
version = "0.2.0"
description = "A cross-platform presenter view for PDF talks"
authors = ["nibuno"]
license = "All rights reserved"
repository = "https://github.com/nibuno/ppp"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdf_presenter_pacemaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
